[package]
name = "container-native"
version = "0.1.0"
edition = "2021"
description = "In-process OCI microVM container runtime (one container = one microVM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
napi = { version = "3", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3"
oci-spec = { version = "0.6.8", features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

# libkrun is the VMM (compiled into this crate). It loads libkrunfw at runtime
# for the guest kernel. There is no Windows build of libkrun.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libkrun = { version = "1.19.8", features = ["net", "blk"] }

[build-dependencies]
napi-build = "2"
