[package]
name = "container-native"
version = "0.1.0"
edition = "2021"
description = "In-process OCI microVM container runtime (one container = one microVM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1.12.1"
futures = "0.3.34"
libc = "0.2"
napi = { version = "3", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3"
oci-spec = { version = "0.6.8", features = ["runtime"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tower = { version = "0.5.3", features = ["buffer", "timeout", "limit", "util"] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
fuse-backend-rs = { version = "0.14", features = ["virtiofs", "virtio-queue"] }
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }
kvm-ioctls = "0.19"
virtio-bindings = "0.2.7"
virtio-queue = "0.17.0"
vm-device = "0.1.0"
vm-memory = { version = "0.17.1", features = ["backend-mmap"] }
vmm-sys-util = "0.12"

[target.'cfg(target_os = "linux")'.dev-dependencies]
virtio-queue = { version = "0.17.0", features = ["test-utils"] }

[build-dependencies]
napi-build = "2"
